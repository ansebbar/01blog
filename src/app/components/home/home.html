<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-8">
      <div class="card">
        <div class="card-header d-flex justify-content-between align-items-center">
          <h3>Welcome to Your Blog!</h3>
          <button class="btn btn-outline-danger" (click)="logout()">Logout</button>
        </div>
        <div class="card-body">
          <div class="alert alert-success">
            <h4>Hello, {{ username }}! 👋</h4>
            <p class="mb-0">You have successfully logged in to your blog application.</p>
          </div>
          
          <div class="row mt-4">
            <div class="col-md-4">
              <div class="card text-center">
                <div class="card-body">
                  <h5>📝 Create Posts</h5>
                  <p>Share your thoughts with the world</p>
                </div>
              </div>
            </div>
            <div class="col-md-4">
              <div class="card text-center">
                <div class="card-body">
                  <h5>💬 Comment</h5>
                  <p>Engage with other users' content</p>
                </div>
              </div>
            </div>
            <div class="col-md-4">
              <div class="card text-center">
                <div class="card-body">
                  <h5>❤️ Like & Share</h5>
                  <p>Interact with posts you enjoy</p>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
