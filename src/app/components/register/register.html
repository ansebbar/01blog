<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card">
        <div class="card-header">
          <h3 class="text-center">Create Account</h3>
        </div>
        <div class="card-body">
          <div *ngIf="errorMessage" class="alert alert-danger">
            {{ errorMessage }}
          </div>
          
          <form (ngSubmit)="onSubmit()" #registerForm="ngForm">
            <div class="mb-3">
              <label for="email" class="form-label">Email</label>
              <input type="email" class="form-control" id="email" 
                     [(ngModel)]="registerRequest.email" name="email" 
                     required email #email="ngModel">
              <div *ngIf="email.invalid && email.touched" class="text-danger">
                Valid email is required
              </div>
            </div>
            
            <div class="mb-3">
              <label for="username" class="form-label">Username</label>
              <input type="text" class="form-control" id="username" 
                     [(ngModel)]="registerRequest.username" name="username" 
                     required minlength="3" #username="ngModel">
              <div *ngIf="username.invalid && username.touched" class="text-danger">
                Username must be at least 3 characters
              </div>
            </div>
            
            <div class="mb-3">
              <label for="password" class="form-label">Password</label>
              <input type="password" class="form-control" id="password" 
                     [(ngModel)]="registerRequest.password" name="password" 
                     required minlength="6" #password="ngModel">
              <div *ngIf="password.invalid && password.touched" class="text-danger">
                Password must be at least 6 characters
              </div>
            </div>
            
            <div class="mb-3">
              <label for="firstName" class="form-label">First Name</label>
              <input type="text" class="form-control" id="firstName" 
                     [(ngModel)]="registerRequest.firstName" name="firstName" 
                     required #firstName="ngModel">
              <div *ngIf="firstName.invalid && firstName.touched" class="text-danger">
                First name is required
              </div>
            </div>
            
            <div class="mb-3">
              <label for="lastName" class="form-label">Last Name</label>
              <input type="text" class="form-control" id="lastName" 
                     [(ngModel)]="registerRequest.lastName" name="lastName" 
                     required #lastName="ngModel">
              <div *ngIf="lastName.invalid && lastName.touched" class="text-danger">
                Last name is required
              </div>
            </div>
            
            <button type="submit" class="btn btn-primary w-100" 
                    [disabled]="registerForm.invalid || isLoading">
              <span *ngIf="isLoading" class="spinner-border spinner-border-sm me-2"></span>
              {{ isLoading ? 'Creating Account...' : 'Register' }}
            </button>
          </form>
          
          <div class="text-center mt-3">
            <p>Already have an account? <a routerLink="/login">Login here</a></p>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
