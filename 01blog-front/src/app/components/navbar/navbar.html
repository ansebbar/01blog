<nav class="navbar navbar-expand-lg navbar-dark bg-gradient-primary shadow-sm fixed-top">
  <div class="container">
    <!-- Logo/Brand -->
    <a class="navbar-brand d-flex align-items-center" routerLink="/">
      <img src="./lol.png" alt="01Blog Platform" class="navbar-logo me-2" style="height: 50px; width: auto;">
      <span class="brand-text d-none d-lg-block">
        <span class="fw-bold">01</span><span class="text-light">Blog</span>
        <small class="d-block text-light opacity-75" style="font-size: 0.75rem; line-height: 1;">Share Your Voice</small>
      </span>
    </a>

    <!-- Mobile Toggle Button -->
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMain"
      aria-controls="navbarMain" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>

    <!-- Navbar Content -->
    <div class="collapse navbar-collapse" id="navbarMain">
      @if(!this.isloggedIn()) {
        <!-- Guest User Navigation -->
        <div class="navbar-nav ms-auto align-items-lg-center">
          <a class="nav-link px-3 py-2 mx-1 text-center" routerLink="/" routerLinkActive="active" 
             [routerLinkActiveOptions]="{exact: true}">
            <i class="bi bi-house d-lg-none me-2"></i>Home
          </a>
          <a class="nav-link px-3 py-2 mx-1 text-center" routerLink="/support" routerLinkActive="active">
            <i class="bi bi-info-circle d-lg-none me-2"></i>Support
          </a>
          <div class="d-flex flex-column flex-lg-row gap-2 mt-3 mt-lg-0">
            <a class="btn btn-outline-light px-4" routerLink="/login">
              <i class="bi bi-box-arrow-in-right me-2"></i>Login
            </a>
            <a class="btn btn-light text-primary px-4" routerLink="/register">
              <i class="bi bi-person-plus me-2"></i>Register
            </a>
          </div>
        </div>
      } @else {
        <!-- Logged-in User Navigation -->
        <div class="navbar-nav ms-auto align-items-lg-center">
          <a class="nav-link px-3 py-2 mx-1 text-center" routerLink="/" routerLinkActive="active"
             [routerLinkActiveOptions]="{exact: true}">
            <i class="bi bi-house d-lg-none me-2"></i>Home
          </a>
          <a class="nav-link px-3 py-2 mx-1 text-center" routerLink="/post-creation" routerLinkActive="active">
            <i class="bi bi-plus-circle d-lg-none me-2"></i>Create Post
          </a>
          <a class="nav-link px-3 py-2 mx-1 text-center" routerLink="/explore" routerLinkActive="active">
            <i class="bi bi-compass d-lg-none me-2"></i>Explore
          </a>
          <!-- <a class="nav-link px-3 py-2 mx-1 text-center" routerLink="/bookmarks" routerLinkActive="active">
            <i class="bi bi-bookmark d-lg-none me-2"></i>Bookmarks
          </a> -->
          
          <!-- User Dropdown for Desktop -->
          <div class="dropdown ms-lg-3 mt-3 mt-lg-0">
            <a href="#" class="d-flex align-items-center text-decoration-none dropdown-toggle" 
               id="userDropdown" data-bs-toggle="dropdown" aria-expanded="false">
              <div class="position-relative">
                <img [src]="this.profileImageUrl" alt="Profile" 
                     class="rounded-circle border border-light" 
                     width="40" height="40" style="object-fit: cover;">
                <span class="position-absolute bottom-0 end-0 p-1 bg-success rounded-circle border border-light">
                  <span class="visually-hidden">Online</span>
                </span>
              </div>
              <div class="d-none d-lg-block ms-2 text-start">
                <span class="text-light fw-semibold">{{ username | titlecase }}</span>
                <small class="d-block text-light opacity-75">View Profile</small>
              </div>
            </a>
            <ul class="dropdown-menu dropdown-menu-end shadow border-0 mt-2" aria-labelledby="userDropdown">
              <li>
                <a class="dropdown-item d-flex align-items-center" routerLink="/profile">
                  <i class="bi bi-person me-2"></i>My Profile
                </a>
              </li>
              <li>
                <a class="dropdown-item d-flex align-items-center" routerLink="/settings">
                  <i class="bi bi-gear me-2"></i>Settings
                </a>
              </li>
              <li>
                <a class="dropdown-item d-flex align-items-center" routerLink="/my-posts">
                  <i class="bi bi-file-text me-2"></i>My Posts
                </a>
              </li>
              <li><hr class="dropdown-divider"></li>
              <li>
                <button class="dropdown-item d-flex align-items-center text-danger" (click)="logout()">
                  <i class="bi bi-box-arrow-right me-2"></i>Logout
                </button>
              </li>
            </ul>
          </div>

          <!-- <div class="dropdown" -->
          
          <!-- Mobile User Actions -->
          <div class="d-lg-none mt-3 pt-3 border-top border-light border-opacity-25">
            <div class="d-flex justify-content-center mb-2">
              <span class="text-light opacity-75">Welcome, {{ username }}</span>
            </div>
            <div class="d-grid gap-2">
              <button class="btn btn-outline-light" routerLink="/profile">
                <i class="bi bi-person me-2"></i>Profile
              </button>
              <button class="btn btn-danger" (click)="logout()">
                <i class="bi bi-box-arrow-right me-2"></i>Logout
              </button>
            </div>
          </div>
          
        </div>
      }
    </div>
  </div>
</nav>

<!-- Spacer to account for fixed navbar -->
<div style="height: 76px;"></div>
