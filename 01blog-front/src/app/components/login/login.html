<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card">
        <div class="card-header">
          <h3 class="text-center">Login to Your Account</h3>
        </div>
        <div class="card-body">
          @if(errorMessage){
          <div class="alert alert-danger">
            {{ errorMessage }}
          </div>
          }
          
          <form (ngSubmit)="onSubmit()" #loginForm="ngForm">
            <div class="mb-3">
              <label for="username" class="form-label">Username or Email Address</label>
              <input type="text" class="form-control" id="username" 
                     [(ngModel)]="loginRequest.username" name="username" 
                     required #username="ngModel">
              @if(username.invalid && username.touched){
              <div class="text-danger">
                Username is required
              </div>
            }
            </div>
            
            <div class="mb-3">
              <label for="password" class="form-label">Password</label>
              <input type="password" class="form-control" id="password" 
                     [(ngModel)]="loginRequest.password" name="password" 
                     required #password="ngModel">
              @if(password.invalid && password.touched){
              <div class="text-danger">
                Password is required
              </div>
            }
            </div>
            <div class="mb-3">
              <a href="#" class="float-end">Forgot Password?</a>
            </div>
            <!-- <div class="mb-3 form-check">
              <input type="checkbox" class="form-check-input" id="rememberMe" 
                     [(ngModel)]="loginRequest.rememberMe" name="rememberMe">
              <label class="form-check-label" for="rememberMe">Remember Me</label>
            </div> -->
            
            <button type="submit" class="btn btn-primary w-100" 
                    [disabled]="loginForm.invalid || isLoading">
              @if(isLoading){
              <span class="spinner-border spinner-border-sm me-2"></span>
              }
              {{ isLoading ? 'Logging in...' : 'Login' }}
            </button>
          </form>
          
          <div class="text-center mt-3">
            <p>Don't have an account? <a routerLink="/register">Register here</a></p>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
